<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrierung</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#ececec;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    background:white;
    padding:40px;
    width:450px;
    border-radius:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#9e2f2f;
    color:white;
    border:none;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="box">
    <h1>Registrierung</h1>

    <input type="text" placeholder="Vorname">
    <input type="text" placeholder="Nachname">
    <input type="email" placeholder="E-Mail">
    <input type="tel" placeholder="Handynummer">
    <input type="password" placeholder="Passwort">
    <input type="password" placeholder="Passwort wiederholen">

    <button>Registrieren</button>
</div>

</body>
</html>
