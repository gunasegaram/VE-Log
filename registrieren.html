<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAeHeDYRadHkcdZRy1ybdlL0vcpyTCZlXM",
  authDomain: "ve-log.firebaseapp.com",
  databaseURL: "https://ve-log-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ve-log",
  storageBucket: "ve-log.firebasestorage.app",
  messagingSenderId: "749978080433",
  appId: "1:749978080433:web:8f64ef99a557fe2346be90"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

window.registrieren = function () {

    const vorname = document.getElementById("vorname").value;
    const nachname = document.getElementById("nachname").value;
    const email = document.getElementById("email").value;
    const handy = document.getElementById("handy").value;
    const passwort = document.getElementById("passwort").value;
    const passwort2 = document.getElementById("passwort2").value;

    if (passwort !== passwort2) {
        alert("Passwörter stimmen nicht überein!");
        return;
    }

    createUserWithEmailAndPassword(auth, email, passwort)
    .then((userCredential) => {

        set(ref(database, "users/" + userCredential.user.uid), {
            vorname: vorname,
            nachname: nachname,
            email: email,
            handy: handy
        });

        alert("Registrierung erfolgreich!");
        window.location.href = "index.html";
    })
    .catch((error) => {
        alert(error.message);
    });
};

</script>
