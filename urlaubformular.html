<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VE-LOG Urlaubsantrag</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f3f3;
    padding:20px;
}

.formular{
    max-width:1000px;
    margin:auto;
    background:#fff;
    border:2px solid #333;
    border-radius:8px;
    padding:25px;
    box-shadow:0 2px 12px rgba(0,0,0,.1);
}

.kopf{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#8e2f2b;
}

.titel{
    font-size:30px;
    font-weight:bold;
}

.linie{
    border-top:4px solid #333;
    margin:20px 0;
}

.abschnitt{
    margin-bottom:20px;
}

.abschnitt-titel{
    background:#8e2f2b;
    color:#fff;
    padding:10px;
    border-radius:5px;
    margin-bottom:15px;
    font-weight:bold;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.vollbreite{
    grid-column:1/-1;
}

.feld{
    display:flex;
    flex-direction:column;
}

.feld label{
    font-weight:bold;
    margin-bottom:5px;
}

.feld input,
.feld textarea{
    padding:10px;
    border:1px solid #999;
    border-radius:4px;
}

.feld textarea{
    min-height:100px;
}

.button-bereich{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:25px;
    padding-top:20px;
    border-top:2px solid #ddd;
}

.button-bereich button{
    border:none;
    border-radius:5px;
    padding:12px 20px;
    font-size:15px;
    font-weight:bold;
    color:#fff;
    cursor:pointer;
}

.btn-zurueck{background:#6c757d;}
.btn-dashboard{background:#198754;}
.btn-speichern{background:#8e2f2b;}
.btn-drucken{background:#444;}
.btn-pdf{background:#1f4e79;}
.btn-loeschen{background:#777;}

.button-bereich button:hover{
    opacity:.9;
}

.hinweis{
    margin-top:20px;
    padding:12px;
    background:#f5f5f5;
    border-left:4px solid #8e2f2b;
}

@media(max-width:768px){

    .kopf{
        flex-direction:column;
        gap:10px;
        text-align:center;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .button-bereich{
        flex-direction:column;
    }

    .button-bereich button{
        width:100%;
    }
}

@media print{

    .button-bereich,
    .hinweis{
        display:none;
    }

    body{
        background:white;
        padding:0;
    }

    .formular{
        border:none;
        box-shadow:none;
    }
}
</style>
</head>

<body>

<div class="formular">

    <div class="kopf">
        <div class="logo">VE-LOG GmbH</div>
        <div class="titel">URLAUBSANTRAG</div>
    </div>

    <div class="linie"></div>

    <div class="abschnitt">
        <div class="abschnitt-titel">
            Mitarbeiterdaten
        </div>

        <div class="form-grid">

            <div class="feld">
                <label>Nachname</label>
                <input type="text" id="name">
            </div>

            <div class="feld">
                <label>Vorname</label>
                <input type="text" id="vorname">
            </div>

            <div class="feld">
                <label>Abteilung</label>
                <input type="text" id="abteilung">
            </div>

            <div class="feld">
                <label>Antragsdatum</label>
                <input type="date" id="datum">
            </div>

        </div>
    </div>

    <div class="abschnitt">
        <div class="abschnitt-titel">
            Urlaubsdaten
        </div>

        <div class="form-grid">

            <div class="feld">
                <label>Urlaub von</label>
                <input type="date" id="von">
            </div>

            <div class="feld">
                <label>Urlaub bis</label>
                <input type="date" id="bis">
            </div>

            <div class="feld">
                <label>Anzahl Urlaubstage</label>
                <input type="number" id="tage">
            </div>

            <div class="feld vollbreite">
                <label>Bemerkung</label>
                <textarea id="bemerkung"></textarea>
            </div>

        </div>
    </div>

    <div class="button-bereich">

        <button
            type="button"
            class="btn-zurueck"
            onclick="history.back()">
            ↩️ Zurück
        </button>

        <button
            type="button"
            class="btn-dashboard"
            onclick="window.location.href='dashboard.html'">
            🏠 Dashboard
        </button>

        <button
            type="button"
            class="btn-speichern"
            onclick="speichernFormular()">
            💾 Speichern
        </button>

        <button
            type="button"
            class="btn-drucken"
            onclick="window.print()">
            🖨 Drucken
        </button>

        <button
            type="button"
            class="btn-pdf"
            onclick="window.print()">
            📄 Als PDF speichern
        </button>

        <button
            type="button"
            class="btn-loeschen"
            onclick="formularLeeren()">
            🗑 Formular leeren
        </button>

    </div>

    <div class="hinweis">
        Hinweis: Die Eingaben werden lokal im Browser gespeichert.
    </div>

</div>

<script>

function speichernFormular(){

    const daten = {
        name: document.getElementById("name").value,
        vorname: document.getElementById("vorname").value,
        abteilung: document.getElementById("abteilung").value,
        datum: document.getElementById("datum").value,
        von: document.getElementById("von").value,
        bis: document.getElementById("bis").value,
        tage: document.getElementById("tage").value,
        bemerkung: document.getElementById("bemerkung").value
    };

    localStorage.setItem(
        "urlaubAntrag",
        JSON.stringify(daten)
    );

    alert("✅ Urlaubsantrag gespeichert.");
}

function ladeFormular(){

    const daten =
        JSON.parse(
            localStorage.getItem("urlaubAntrag")
        );

    if(!daten) return;

    document.getElementById("name").value =
        daten.name || "";

    document.getElementById("vorname").value =
        daten.vorname || "";

    document.getElementById("abteilung").value =
        daten.abteilung || "";

    document.getElementById("datum").value =
        daten.datum || "";

    document.getElementById("von").value =
        daten.von || "";

    document.getElementById("bis").value =
        daten.bis || "";

    document.getElementById("tage").value =
        daten.tage || "";

    document.getElementById("bemerkung").value =
        daten.bemerkung || "";
}

function formularLeeren(){

    if(!confirm(
        "Möchten Sie wirklich alle Daten löschen?"
    )) return;

    document
        .querySelectorAll("input, textarea")
        .forEach(el => el.value = "");

    localStorage.removeItem("urlaubAntrag");
}

window.onload = ladeFormular;

</script>

</body>
</html>
