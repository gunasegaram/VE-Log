<div class="signature-box">
    <div class="signature-title">UNTERSCHRIFT ANTRAGSTELLER</div>

    <canvas
        id="signatureAntragsteller"
        class="signature-pad">
    </canvas>

    <div class="signature-buttons">
        <button type="button"
                class="btn-clear"
                onclick="clearCanvas('signatureAntragsteller')">
            🗑 Löschen
        </button>

        <button type="button"
                class="btn-upload"
                onclick="uploadSignature('signatureAntragsteller')">
            📁 Unterschrift hochladen
        </button>

        <button type="button"
                class="btn-save-signature"
                onclick="saveSignaturePNG('signatureAntragsteller')">
            💾 Als PNG speichern
        </button>
    </div>

    <input
        type="file"
        id="upload-signatureAntragsteller"
        class="file-input"
        accept="image/png,image/jpeg,image/jpg"
        onchange="loadSignature(this,'signatureAntragsteller')">
</div>
