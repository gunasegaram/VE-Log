<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbeitsnachweis LKW</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

.nav-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.nav-btn{
    background:#8e2f2b;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.nav-btn:hover{
    background:#742522;
}

h1{
    margin-bottom:20px;
}

.row{
    display:grid;
    gap:15px;
    margin-bottom:15px;
}

.row-3{
    grid-template-columns:2fr 2fr 1fr;
}

.row-4{
    grid-template-columns:2fr 2fr 2fr 1fr;
}

input{
    width:100%;
    padding:8px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.weekdays{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}

th{
    background:#8e2f2b;
    color:white;
}

td input{
    border:none;
}

.bottom{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:20px;
}

.box{
    border:1px solid #ccc;
    padding:15px;
}

.btn-save{
    margin-top:20px;
    background:#8e2f2b;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="nav-buttons">
<button class="nav-btn"
onclick="window.location.href='zeiterfassung.html'">
⏱ Zur Zeiterfassung
</button>

<button class="nav-btn"
onclick="window.location.href='dashboard.html'">
🏠 Zum Dashboard
</button>
</div>

<table>

</tr>

<tr>
<td><input type="text"></td>
<td><input type="text"></td>
<td><input type="text"></td>
<td><input type="text"></td>
</tr>
</table>

<div class="bottom">

<div class="box">
<h3>Rüstzeit</h3>

<label>von</label>
<input type="time">

<label>bis</label>
<input type="time">

<label>Std.</label>
<input type="number">

<br><br>

<h3>Wartung</h3>

<label>von</label>
<input type="time">

<label>bis</label>
<input type="time">

<label>Std.</label>
<input type="number">
</div>

<div class="box">
<h3>Reparatur</h3>

<label>von</label>
<input type="time">

<input type="time">

<label>Std.</label>

</div>

<button class="btn-save">
💾 Arbeitsnachweis LKW speichern
</button>

</div>

</body>
</html>
