<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empfänger - Materialversandanzeige</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

header{
    background:#8e2f2b;
    color:white;
    padding:15px 30px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.form-card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th{
    background:#8e2f2b;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:5px;
}

td input{
    border:none;
}

.signature{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:25px;
}

.sig-box{
    border:1px solid #ccc;
    border-radius:8px;
    min-height:120px;
    padding:15px;
}

.button-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:25px;
}

.btn{
    border:none;
    border-radius:8px;
    padding:12px 20px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.save-btn{
    background:#8e2f2b;
}

.print-btn{
    background:#444;
}

.pdf-btn{
    background:#1f4e79;
}

.back-btn{
    background:#666;
}

.btn:hover{
    opacity:.9;
}

@media(max-width:768px){

    .row{
        grid-template-columns:1fr;
    }

    .signature{
        grid-template-columns:1fr;
    }

}

@media print{

    header,
    .button-group{
        display:none;
    }

    body{
        background:white;
    }

    .form-card{
        box-shadow:none;
    }

}

</style>
</head>

<body>

<header>
    <h1>👤 Empfänger</h1>
</header>

<div class="container">

    <div class="form-card">

        <div class="row">

            <div>
                <label>Name Abholer</label>
                <input type="text" id="nameAbholer">
            </div>

            <div>
                <label>Baustelle</label>
                <input type="text" id="baustelle">
            </div>

        </div>

        <div class="row">

            <div>
                <label>Name Anforderer</label>
                <input type="text" id="nameAnforderer">
            </div>

            <div>
                <label>Empfänger</label>
                <input type="text" id="empfaenger">
            </div>

        </div>

        <div class="row">

            <div>
                <label>Versand mit LKW Nr.</label>
                <input type="text" id="lkw">
            </div>

            <div>
                <label>Fremdfahrzeug</label>
                <input type="text" id="fremdfahrzeug">
            </div>

        </div>

        <table>

            <tr>
                <th>Bestell-Menge</th>
                <th>Liefer-Menge</th>
                <th>Einheit</th>
                <th>Gegenstand</th>
                <th>Neu/Gebraucht</th>
                <th>Inventar-Nr.</th>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>

        </table>

        <div class="signature">

            <div class="sig-box">
                <strong>Absender</strong><br><br>
                Für den richtigen Versand
            </div>

            <div class="sig-box">
                <strong>Fuhrunternehmer</strong><br><br>
                Für die richtige Übernahme
            </div>

            <div class="sig-box">
                <strong>Empfänger</strong>
            </div>

            <div class="sig-box">
                <strong>Externe Abrechnung</strong>
            </div>

        </div>

        <div class="button-group">

            <button class="btn save-btn"
                    onclick="speichernFormular()">
                💾 Speichern
            </button>

            <button class="btn print-btn"
                    onclick="window.print()">
                🖨️ Drucken
            </button>

            <button class="btn pdf-btn"
                    onclick="window.print()">
                📄 Als PDF speichern
            </button>

            <button class="btn back-btn"
                    onclick="window.location.href='materialversand.html'">
                ← Zurück
            </button>

        </div>

    </div>

</div>

<script>

function speichernFormular(){

    const daten = {

        nameAbholer:
            document.getElementById("nameAbholer").value,

        baustelle:
            document.getElementById("baustelle").value,

        nameAnforderer:
            document.getElementById("nameAnforderer").value,

        empfaenger:
            document.getElementById("empfaenger").value,

        lkw:
            document.getElementById("lkw").value,

        fremdfahrzeug:
            document.getElementById("fremdfahrzeug").value

    };

    localStorage.setItem(
        "materialEmpfaenger",
        JSON.stringify(daten)
    );

    alert("✅ Daten gespeichert");
}

function ladeFormular(){

    const daten = JSON.parse(
        localStorage.getItem("materialEmpfaenger")
    );

    if(!daten) return;

    document.getElementById("nameAbholer").value =
        daten.nameAbholer || "";

    document.getElementById("baustelle").value =
        daten.baustelle || "";

    document.getElementById("nameAnforderer").value =
        daten.nameAnforderer || "";

    document.getElementById("empfaenger").value =
        daten.empfaenger || "";

    document.getElementById("lkw").value =
        daten.lkw || "";

    document.getElementById("fremdfahrzeug").value =
        daten.fremdfahrzeug || "";
}

window.onload = ladeFormular;

</script>

</body>
</html>
