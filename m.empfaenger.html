<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitale Unterschrift</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    color:#8e2f2b;
    margin-bottom:20px;
}

.signature-pad{
    width:100%;
    height:250px;
    border:2px solid #ccc;
    border-radius:8px;
    background:white;
    touch-action:none;
    cursor:crosshair;
}

.button-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

button,
.upload-btn{
    background:#8e2f2b;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

button:hover,
.upload-btn:hover{
    opacity:0.9;
}

.upload-btn input{
    display:none;
}

.preview{
    margin-top:20px;
}

.preview img{
    max-width:100%;
    border:1px solid #ccc;
    border-radius:8px;
}

</style>
</head>

<body>

<div class="container">

    <h1>Digitale Unterschrift</h1>

    <canvas id="signaturePad" class="signature-pad"></canvas>

    <div class="button-group">

        <button onclick="clearPad()">
            🗑 Löschen
        </button>

        <label class="upload-btn">
            📁 Signatur hochladen
            <input type="file"
                   accept="image/png,image/jpeg"
                   onchange="uploadSignature(event)">
        </label>

        <button onclick="downloadSignature()">
            💾 Als PNG speichern
        </button>

    </div>

    <div class="preview">
        <h3>Vorschau</h3>
        <img id="previewImage">
    </div>

</div>

<script>

const canvas = document.getElementById("signaturePad");
const ctx = canvas.getContext("2d");

function resizeCanvas(){

    canvas.width = canvas.offsetWidth;
    canvas.height = 250;
}

resizeCanvas();

let drawing = false;

function startDrawing(x,y){

    drawing = true;

    ctx.beginPath();
    ctx.moveTo(x,y);
}

function draw(x,y){

    if(!drawing) return;

    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#000";

    ctx.lineTo(x,y);
    ctx.stroke();
}

function stopDrawing(){

    drawing = false;
    updatePreview();
}

canvas.addEventListener("mousedown",(e)=>{

    startDrawing(
        e.offsetX,
        e.offsetY
    );

});

canvas.addEventListener("mousemove",(e)=>{

    draw(
        e.offsetX,
        e.offsetY
    );

});

canvas.addEventListener("mouseup",stopDrawing);
canvas.addEventListener("mouseleave",stopDrawing);

canvas.addEventListener("touchstart",(e)=>{

    e.preventDefault();

    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];

    startDrawing(
        touch.clientX - rect.left,
        touch.clientY - rect.top
    );

});

canvas.addEventListener("touchmove",(e)=>{

    e.preventDefault();

    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];

    draw(
        touch.clientX - rect.left,
        touch.clientY - rect.top
    );

});

canvas.addEventListener("touchend",stopDrawing);

function clearPad(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    document.getElementById("previewImage").src = "";
}

function updatePreview(){

    document.getElementById("previewImage").src =
        canvas.toDataURL("image/png");
}

function uploadSignature(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const img = new Image();

        img.onload = function(){

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
            );

            updatePreview();
        };

        img.src = e.target.result;
    };

    reader.readAsDataURL(file);
}

function downloadSignature(){

    const link = document.createElement("a");

    link.download = "unterschrift.png";
    link.href = canvas.toDataURL("image/png");

    link.click();
}

window.addEventListener("resize",resizeCanvas);

</script>

</body>
</html>
