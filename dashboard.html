<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VE-Log Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

header{
    background:#8e2f2b;
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.container{
    padding:30px;
}

.welcome{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card h3{
    margin-bottom:10px;
    color:#8e2f2b;
}

button{
    background:white;
    color:#8e2f2b;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ececec;
}

#userEmail{
    margin-top:10px;
    color:#666;
}
</style>
</head>

<body>

<header>
    <div class="logo">VE-Log Dashboard</div>
    <button onclick="logout()">Abmelden</button>
</header>

<div class="container">

    <div class="welcome">
        <h2>Willkommen bei VE-Log</h2>
        <p id="userEmail">Benutzer wird geladen...</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>🕒 Zeiterfassung</h3>
            <p>Arbeitszeiten erfassen und verwalten.</p>
        </div>

        <div class="card">
            <h3>👥 Mitarbeiter</h3>
            <p>Mitarbeiterinformationen anzeigen.</p>
        </div>

        <div class="card">
            <h3>📅 Urlaub</h3>
            <p>Urlaubsanträge verwalten.</p>
        </div>

        <div class="card">
            <h3>⚙️ Einstellungen</h3>
            <p>Kontoeinstellungen bearbeiten.</p>
        </div>

    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAeHeDYRadHkcdZRy1ybdlL0vcpyTCZlXM",
    authDomain: "ve-log.firebaseapp.com",
    databaseURL: "https://ve-log-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ve-log",
    storageBucket: "ve-log.firebasestorage.app",
    messagingSenderId: "749978080433",
    appId: "1:749978080433:web:8f64ef99a557fe2346be90"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

    if(user){
        document.getElementById("userEmail").innerHTML =
        "Angemeldet als: <b>" + user.email + "</b>";
    } else {
        window.location.href = "index.html";
    }

});

window.logout = function(){
    signOut(auth)
    .then(() => {
        window.location.href = "index.html";
    });
};

</script>

</body>
</html>
