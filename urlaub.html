<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VE-LOG Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#ececec;
    padding:30px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    border-left:5px solid #8e2f2b;
}

.card-logo{
    text-align:center;
    margin-bottom:20px;
}

.card-logo img{
    width:150px;
    height:auto;
}

.card h3{
    text-align:center;
    color:#17345d;
    font-size:30px;
    margin-bottom:20px;
}

.urlaub-stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-bottom:25px;
}

.stat-card{
    background:#f5f5f5;
    border-radius:10px;
    padding:15px;
    text-align:center;
    border-left:4px solid #8e2f2b;
}

.stat-number{
    display:block;
    font-size:28px;
    font-weight:bold;
    color:#17345d;
}

.stat-label{
    display:block;
    margin-top:5px;
    color:#666;
    font-size:13px;
}

.urlaub-btn{
    width:100%;
    background:#8e2f2b;
    color:white;
    border:none;
    border-radius:10px;
    padding:15px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

.urlaub-btn:hover{
    background:#742421;
}

@media(max-width:900px){

    .urlaub-stats{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="card">

    <div class="card-logo">
        <img src="logo.png" alt="VE-LOG Logo">
    </div>

    <h3>📅 Urlaub</h3>

    <div class="urlaub-stats">

        <div class="stat-card">
            <span class="stat-number" id="urlaubstage">30</span>
            <span class="stat-label">Urlaubstage</span>
        </div>

        <div class="stat-card">
            <span class="stat-number" id="genommen">12</span>
            <span class="stat-label">Genommen</span>
        </div>

        <div class="stat-card">
            <span class="stat-number" id="verfuegbar">18</span>
            <span class="stat-label">Verfügbar</span>
        </div>

        <div class="stat-card">
            <span class="stat-number" id="offen">2</span>
            <span class="stat-label">Offen</span>
        </div>

        <div class="stat-card">
            <span class="stat-number" id="genehmigt">5</span>
            <span class="stat-label">Genehmigt</span>
        </div>

    </div>

    <button class="urlaub-btn"
            onclick="window.location.href='urlaubformular.html'">
        📄 Urlaubformular öffnen
    </button>

</div>

<script>

function ladeUrlaubsdaten(){

    const daten =
    JSON.parse(
        localStorage.getItem("urlaubDaten")
    );

    if(!daten) return;

    document.getElementById("urlaubstage").innerText =
    daten.urlaubstage || 30;

    document.getElementById("genommen").innerText =
    daten.genommen || 0;

    document.getElementById("verfuegbar").innerText =
    daten.verfuegbar || 30;

    document.getElementById("offen").innerText =
    daten.offen || 0;

    document.getElementById("genehmigt").innerText =
    daten.genehmigt || 0;
}

ladeUrlaubsdaten();

</script>

</body>
</html>
