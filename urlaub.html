<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VE-LOG | Urlaubsformular</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#ececec;
}

/* HEADER */

header{
    background:#8e2f2b;
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.logo img{
    height:60px;
    width:auto;
}

header h1{
    flex:1;
    text-align:center;
    font-size:30px;
}

.back-btn{
    background:white;
    color:#8e2f2b;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.back-btn:hover{
    background:#f2f2f2;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:25px auto;
    padding:15px;
}

/* CARD */

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

/* URLAUBSKACHELN */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#f9f9f9;
    border-left:5px solid #8e2f2b;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.stat-number{
    display:block;
    font-size:28px;
    font-weight:bold;
    color:#17345d;
}

.stat-label{
    font-size:13px;
    color:#666;
}

/* FORMULAR */

.form-title{
    font-size:28px;
    color:#17345d;
    margin-bottom:20px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    margin-bottom:6px;
    font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
    border:1px solid #ccc;
    border-radius:8px;
    padding:12px;
    font-size:14px;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.full{
    grid-column:1 / -1;
}

/* STATUS */

.status-box{
    margin-top:20px;
    background:#f9f9f9;
    border-left:5px solid #8e2f2b;
    border-radius:10px;
    padding:15px;
}

.status-box div{
    margin:8px 0;
}

/* BUTTONS */

.button-group{
    margin-top:25px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.save-btn{
    background:#8e2f2b;
}

.print-btn{
    background:#444;
}

.reset-btn{
    background:#666;
}

.btn:hover{
    opacity:0.9;
}

/* MOBILE */

@media(max-width:900px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .row{
        grid-template-columns:1fr;
    }

}

@media(max-width:768px){

    header{
        flex-direction:column;
        text-align:center;
    }

    header h1{
        font-size:24px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .button-group{
        flex-direction:column;
    }

    .btn,
    .back-btn{
        width:100%;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        <img src="logo.png" alt="VE-Log Logo">
    </div>

    <h1>📅 Urlaubsformular</h1>

    <button class="back-btn"
            onclick="window.location.href='dashboard.html'">
        ← Zurück zum Dashboard
    </button>

</header>

<div class="container">

    <div class="card">

        <div class="stats">

            <div class="stat">
                <span class="stat-number">30</span>
                <span class="stat-label">Urlaubstage</span>
            </div>

            <div class="stat">
                <span class="stat-number">12</span>
                <span class="stat-label">Genommen</span>
            </div>

            <div class="stat">
                <span class="stat-number">18</span>
                <span class="stat-label">Verfügbar</span>
            </div>

            <div class="stat">
                <span class="stat-number">2</span>
                <span class="stat-label">Offen</span>
            </div>

            <div class="stat">
                <span class="stat-number">5</span>
                <span class="stat-label">Genehmigt</span>
            </div>

        </div>

        <h2 class="form-title">
            Urlaubsantrag erstellen
        </h2>

        <form id="urlaubForm">

            <div class="row">

                <div class="form-group">
                    <label>Mitarbeiter</label>
                    <input type="text" required>
                </div>

                <div class="form-group">
                    <label>Personalnummer</label>
                    <input type="text">
                </div>

            </div>

            <div class="row">

                <div class="form-group">
                    <label>Urlaub von</label>
                    <input type="date" required>
                </div>

                <div class="form-group">
                    <label>Urlaub bis</label>
                    <input type="date" required>
                </div>

            </div>

            <div class="row">

                <div class="form-group">
                    <label>Urlaubsart</label>

                    <select>

                        <option>Erholungsurlaub</option>
                        <option>Sonderurlaub</option>
                        <option>Resturlaub</option>
                        <option>Unbezahlter Urlaub</option>

                    </select>

                </div>

                <div class="form-group">
                    <label>Anzahl Urlaubstage</label>
                    <input type="number">
                </div>

            </div>

            <div class="form-group full">

                <label>Bemerkung</label>

                <textarea placeholder="Zusätzliche Informationen eingeben"></textarea>

            </div>

            <div class="button-group">

                <button type="submit"
                        class="btn save-btn">
                    ✅ Antrag absenden
                </button>

                <button type="button"
                        class="btn print-btn"
                        onclick="window.print()">
                    🖨 Drucken
                </button>

                <button type="reset"
                        class="btn reset-btn">
                    🔄 Zurücksetzen
                </button>

            </div>

        </form>

        <div class="status-box">

            <div>🟡 Offene Urlaubsanträge: 2</div>
            <div>✅ Genehmigte Anträge: 5</div>
            <div>❌ Abgelehnte Anträge: 1</div>

        </div>

    </div>

</div>

<script>

document.getElementById("urlaubForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    alert(
        "✅ Urlaubsantrag erfolgreich eingereicht!"
    );

});

</script>

</body>
</html>
