<script>

/* =========================================================
   LIEFERSCHEIN NUMMER
========================================================= */

function generateLieferschein(){

    let nr = parseInt(

        localStorage.getItem(
            "materialNr"
        ) || "0"

    );


    nr++;


    localStorage.setItem(
        "materialNr",
        nr
    );


    return nr
        .toString()
        .padStart(5,"0");

}


/* =========================================================
   SIGNATURE PADS
========================================================= */

const pads = {};


function createPad(id){

    const canvas =
        document.getElementById(id);

    if(!canvas) return;


    const ctx =
        canvas.getContext("2d");


    let drawing = false;


    function resizeCanvas(){

        const rect =
            canvas.getBoundingClientRect();


        const ratio =
            window.devicePixelRatio || 1;


        canvas.width =
            rect.width * ratio;


        canvas.height =
            rect.height * ratio;


        ctx.setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );


        ctx.lineWidth = 2;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.strokeStyle = "#000000";

    }


    resizeCanvas();


    window.addEventListener(
        "resize",
        resizeCanvas
    );


    function getPosition(e){

        const rect =
            canvas.getBoundingClientRect();


        return {

            x:
                e.clientX -
                rect.left,

            y:
                e.clientY -
                rect.top

        };

    }


    canvas.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();


            canvas.setPointerCapture(
                e.pointerId
            );


            const pos =
                getPosition(e);


            drawing = true;


            ctx.beginPath();


            ctx.moveTo(
                pos.x,
                pos.y
            );

        }
    );


    canvas.addEventListener(
        "pointermove",
        function(e){

            if(!drawing) return;


            e.preventDefault();


            const pos =
                getPosition(e);


            ctx.lineTo(
                pos.x,
                pos.y
            );


            ctx.stroke();

        }
    );


    canvas.addEventListener(
        "pointerup",
        function(){

            drawing = false;

        }
    );


    canvas.addEventListener(
        "pointercancel",
        function(){

            drawing = false;

        }
    );


    pads[id] = {

        canvas:canvas,

        ctx:ctx

    };

}


/* =========================================================
   SIGNATUR LÖSCHEN
========================================================= */

function clearCanvas(id){

    const pad =
        pads[id];


    if(!pad) return;


    pad.ctx.clearRect(

        0,
        0,
        pad.canvas.width,
        pad.canvas.height

    );

}


/* =========================================================
   ALLE SIGNATUREN LÖSCHEN
========================================================= */

function clearAllSignatures(){

    clearCanvas(
        "ausgeber"
    );


    clearCanvas(
        "empfaengerSignatur"
    );

}


/* =========================================================
   SIGNATUR HOCHLADEN
========================================================= */

function uploadSignature(id){

    const input =
        document.getElementById(
            "upload-" + id
        );


    if(input){

        input.click();

    }

}


/* =========================================================
   SIGNATUR AUS BILD LADEN
========================================================= */

function loadSignature(
    input,
    id
){

    const file =
        input.files[0];


    if(!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const img =
                new Image();


            img.onload =
                function(){

                    const pad =
                        pads[id];


                    if(!pad) return;


                    const canvas =
                        pad.canvas;


                    const ctx =
                        pad.ctx;


                    const width =
                        canvas.clientWidth;


                    const height =
                        canvas.clientHeight;


                    ctx.clearRect(

                        0,
                        0,
                        canvas.width,
                        canvas.height

                    );


                    const scale =
                        Math.min(

                            width /
                            img.width,

                            height /
                            img.height

                        );


                    const w =
                        img.width *
                        scale;


                    const h =
                        img.height *
                        scale;


                    const x =
                        (width - w) / 2;


                    const y =
                        (height - h) / 2;


                    ctx.drawImage(

                        img,

                        x,
                        y,

                        w,
                        h

                    );

                };


            img.src =
                e.target.result;

        };


    reader.readAsDataURL(file);

}


/* =========================================================
   SIGNATUR ALS PNG SPEICHERN
========================================================= */

function saveSignaturePNG(id){

    const pad =
        pads[id];


    if(!pad) return;


    const link =
        document.createElement("a");


    link.download =
        id +
        "_Unterschrift.png";


    link.href =
        pad.canvas.toDataURL(
            "image/png"
        );


    link.click();

}


/* =========================================================
   FORMULAR SPEICHERN
========================================================= */

function speichernFormular(){

    const nummer =
        document.getElementById(
            "lieferscheinNr"
        );


    if(
        nummer.innerText ===
        "00000"
    ){

        nummer.innerText =
            generateLieferschein();

    }


    const daten = {

        lieferscheinNr:
            nummer.innerText,

        empfaenger:

function loadFormular(){

            localStorage.getItem(
                "materialausgabe"
            )

        );


    if(!daten) return;


    document.getElementById(
        "lieferscheinNr"
    ).innerText =
        daten.lieferscheinNr ||
        "00000";


    document.getElementById(
        "empfaengerName"
    ).value =
        daten.empfaenger || "";


    document.getElementById(
        "datum"
    ).value =

        daten.baustelle || "";


    document.getElementById(

    ).value =
        daten.material || "";


    document.getElementById(
        "menge"

        daten.menge || "";


    document.getElementById(
        "diesel"
    ).checked =
        daten.diesel || false;


    document.getElementById(

    document.getElementById(

    document.getElementById(

    ).checked =

}

window.addEventListener(
