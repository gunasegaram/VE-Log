<script>

/* =========================================================
   LIEFERSCHEIN NUMMER
========================================================= */

function generateLieferschein(){

    let nr = parseInt(

        localStorage.getItem(
            "materialNr"
        ) || "0"

    );

    nr++;

    localStorage.setItem(
        "materialNr",
        nr
    );

    return nr
        .toString()
        .padStart(5,"0");
}


/* =========================================================
   SIGNATUR
========================================================= */

const pads = {};



function createPad(id){

    const canvas =
        document.getElementById(id);

    if(!canvas) return;


    const ctx =
        canvas.getContext("2d");


    function resizeCanvas(){

        const oldImage =
            canvas.toDataURL();


        const rect =
            canvas.getBoundingClientRect();


        const ratio =
            window.devicePixelRatio || 1;


        canvas.width =
            rect.width * ratio;


        canvas.height =
            rect.height * ratio;


        ctx.setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );


        ctx.lineWidth = 2;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.strokeStyle = "#000";


        if(oldImage !== "data:,"){

            const img =
                new Image();

            img.onload =
                function(){

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        rect.width,
                        rect.height
                    );

                };

            img.src = oldImage;

        }

    }


    resizeCanvas();


    window.addEventListener(
        "resize",
        resizeCanvas
    );


    function position(e){

        const rect =
            canvas.getBoundingClientRect();


        return {

            x:
                e.clientX -
                rect.left,

            y:
                e.clientY -
                rect.top

        };

    }


    canvas.addEventListener(
        "pointerdown",
        function(e){

            canvas.setPointerCapture(
                e.pointerId
            );


            const p =
                position(e);


            drawing = true;

            ctx.beginPath();

            ctx.moveTo(
                p.x,
                p.y
            );

        }
    );


    let drawing = false;


    canvas.addEventListener(
        "pointermove",
        function(e){

            if(!drawing) return;


            const p =
                position(e);


            ctx.lineTo(
                p.x,
                p.y
            );

            ctx.stroke();

        }
    );


    canvas.addEventListener(
        "pointerup",
        function(){

            drawing = false;

        }
    );


    canvas.addEventListener(
        "pointercancel",
        function(){

            drawing = false;

        }
    );


    pads[id] = {

        canvas:canvas,

        ctx:ctx

    };

}



/* =========================================================
   SIGNATUR LÖSCHEN
========================================================= */

function clearCanvas(id){

    const pad =
        pads[id];

    if(!pad) return;


    pad.ctx.clearRect(

        0,
        0,
        pad.canvas.width,
        pad.canvas.height

    );


    localStorage.removeItem(
        "signature_" + id
    );

}



/* =========================================================
   ALLE SIGNATUREN LÖSCHEN
========================================================= */

function clearAllSignatures(){

    clearCanvas("ausgeber");

    clearCanvas(
        "empfaengerSignatur"
    );

}



/* =========================================================
   SIGNATUR HOCHLADEN
========================================================= */

function uploadSignature(id){

    document
        .getElementById(
            "upload-" + id
        )
        .click();

}



/* =========================================================
   HOCHGELADENE SIGNATUR
========================================================= */

function loadSignature(
    input,
    id
){

    const file =
        input.files[0];

    if(!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const img =
                new Image();


            img.onload =
                function(){

                    const pad =
                        pads[id];


                    if(!pad) return;


                    const canvas =
                        pad.canvas;

                    const ctx =
                        pad.ctx;


                    const width =
                        canvas.clientWidth;

                    const height =
                        canvas.clientHeight;


                    ctx.clearRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    const scale =
                        Math.min(

                            width / img.width,

                            height / img.height

                        );


                    const w =
                        img.width * scale;

                    const h =
                        img.height * scale;


                    const x =
                        (width - w) / 2;

                    const y =
                        (height - h) / 2;


                    ctx.drawImage(
                        img,
                        x,
                        y,
                        w,
                        h
                    );

                };


            img.src =
                e.target.result;

        };


    reader.readAsDataURL(file);

}



/* =========================================================
   PNG SPEICHERN
========================================================= */

function saveSignaturePNG(id){

    const pad =
        pads[id];

    if(!pad) return;


    const link =
        document.createElement("a");


    link.download =
        id + "_Unterschrift.png";


    link.href =
        pad.canvas.toDataURL(
            "image/png"
        );


    link.click();

}



/* =========================================================
   FORMULAR SPEICHERN
========================================================= */

function speichernFormular(){

    const nummer =
        document.getElementById(
            "lieferscheinNr"
        );


    if(
        nummer.innerText ===
        "00000"
    ){

        nummer.innerText =
            generateLieferschein();

    }


    const daten = {

        lieferscheinNr:
            nummer.innerText,

        empfaenger:
            document.getElementById(
                "empfaengerName"
            ).value,

        datum:
            document.getElementById(
                "datum"
            ).value,

        geraet:
            document.getElementById(
                "geraet"
            ).value,

        fahrer:
            document.getElementById(
                "fahrer"
            ).value,

        baustelle:
            document.getElementById(
                "baustelle"
            ).value,

        material:
            document.getElementById(
                "material"
            ).value,

        menge:
            document.getElementById(
                "menge"
            ).value,

        bemerkungen:
            document.getElementById(
                "bemerkungen"
            ).value

    };


    localStorage.setItem(

        "materialausgabe",

        JSON.stringify(daten)

    );


    /* Signaturen */

    Object.keys(pads).forEach(
        function(id){

            localStorage.setItem(

                "signature_" + id,

                pads[id]
                    .canvas
                    .toDataURL(
                        "image/png"
                    )

            );

        }
    );


    alert(
        "✅ Formular wurde gespeichert.\n\n" +
        "Lieferschein Nr.: " +
        nummer.innerText
    );

}
