<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VE-Log Login</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#ececec;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.login-box{
    background:white;
    width:420px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    max-width:200px;
}

h1{
    color:#1d3557;
    margin-bottom:10px;
}

p{
    color:#666;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#8e2f2b;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#762522;
}

.register{
    text-align:center;
    margin-top:25px;
}

.register a{
    color:#8e2f2b;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="login-box">

   <div class="logo">
    <img src="VElog Logo.png" alt="VE-LOG">
    </div>

    <h1>Herzlich Willkommen</h1>
    <p>Melde dich mit deinem Mitarbeiterkonto an.</p>

    <label>E-Mail-Adresse</label>
    <input type="email" placeholder="name@unternehmen.de">

    <label>Passwort</label>
    <input type="password" placeholder="Passwort eingeben">

    <button>Anmelden</button>

    <div class="register">
    <a href="#" onclick="document.getElementById('registerForm').style>

<div id="registerForm" style="display:none; margin-top:20px;">

    <label>Vorname</label>
    <input type="text" placeholder="Vorname">

    <label>Nachname</label>
    <input type="text" placeholder="Nachname">

    <label>E-Mail</label>
    <input type="email" placeholder="E-Mail">

    <label>Handynummer</label>
    <input type="tel" placeholder="+49 ...">

    <label>Passwort</label>
    <input type="password" placeholder="Passwort">

    <label>Passwort wiederholen</label>
    <input type="password" placeholder="Passwort wiederholen">

    <button>Registrieren</button>

</div>

</body>
</html>
