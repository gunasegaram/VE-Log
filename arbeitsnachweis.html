<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbeitsnachweis</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
}

.nav-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.nav-btn{
    background:#8e2f2b;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.nav-btn:hover{
    background:#742522;
}

h1{
    color:#333;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

input, select, textarea{
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table, th, td{
    border:1px solid #ccc;
}

th{
    background:#8e2f2b;
    color:white;
    padding:10px;
}

td{
    padding:5px;
}

td input{
    border:none;
    width:100%;
}

.save-btn{
    margin-top:20px;
    background:#8e2f2b;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="nav-buttons">
    <button class="nav-btn"
        onclick="window.location.href='zeiterfassung.html'">
        ⏱ Zur Zeiterfassung
    </button>

    <button class="nav-btn"
        onclick="window.location.href='dashboard.html'">
        🏠 Zum Dashboard
    </button>
</div>

<h1>📝 Arbeitsnachweis</h1>

<div class="row">
    <input type="text" placeholder="Name">
    <input type="date">
</div>

<div class="row">
    <input type="text" placeholder="Firma">
    <input type="text" placeholder="Baustelle">
</div>

<div class="row">
    <input type="time" placeholder="Arbeitsbeginn">
    <input type="time" placeholder="Arbeitsende">
</div>

<div class="row">
    <input type="number" placeholder="Pause (Minuten)">
    <input type="number" placeholder="Kilometer">
</div>

<div class="row">
    <select>
        <option>Wochentag wählen</option>
        <option>Montag</option>
        <option>Dienstag</option>
        <option>Mittwoch</option>
        <option>Donnerstag</option>
        <option>Freitag</option>
        <option>Samstag</option>
        <option>Sonntag</option>
    </select>

    <select>
        <option>Feiertag?</option>
        <option>Nein</option>
        <option>Ja</option>
    </select>
</div>

<h3>Ausgeführte Arbeiten</h3>

<table>
<tr>
    <th>Uhrzeit von-bis</th>
    <th>Ausgeführte Arbeiten</th>
    <th>Stunden</th>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

</table>

<textarea
placeholder="Zusätzliche Bemerkungen"
style="margin-top:20px;height:100px;">
</textarea>

<br>

<button class="save-btn">
    💾 Arbeitsnachweis speichern
</button>

</div>

</body>
</html>
